{% extends 'base.html' %}

{% block title %}Edit Order{% endblock %}

{% block content %}
<style>
    body { background-color: #111; }
    .box {
        background-color: #222;
        color: white;
        width: 420px;
        margin: 40px auto;
        padding: 25px;
        border-radius: 12px;
        border: 1px solid #444;
    }
    input, select {
        width: 100%;
        padding: 8px;
        margin: 8px 0 15px 0;
        border-radius: 4px;
        border: 1px solid #555;
        background: #333;
        color: white;
    }
    .btn {
        width: 100%;
        padding: 10px;
        background-color: #04a2ff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    .btn:hover { background-color: #0288d1; }
</style>

<div class="box">
    <h2>Edit Order #{{ order.id }}</h2>

    <form method="POST">
        <label>Customer Name</label>
        <input type="text" name="customer_name" value="{{ order.customer_name }}" required>

        <label>Customer Email</label>
        <input type="email" name="customer_email" value="{{ order.customer_email }}" required>

        <label>Pizza</label>
        <input type="text" name="pizza" value="{{ order.pizza }}" required>

        <label>Quantity</label>
        <input type="number" name="quantity" value="{{ order.quantity }}" min="1" required>

        <label>Total Price</label>
        <input type="number" step="0.01" name="total_price" value="{{ order.total_price }}" required>

        <label>Status</label>
        <select name="status">
            <option value="new" {% if order.status == 'new' %}selected{% endif %}>new</option>
            <option value="preparing" {% if order.status == 'preparing' %}selected{% endif %}>preparing</option>
            <option value="delivered" {% if order.status == 'delivered' %}selected{% endif %}>delivered</option>
            <option value="cancelled" {% if order.status == 'cancelled' %}selected{% endif %}>cancelled</option>
        </select>

        <button type="submit" class="btn">Save Changes</button>
    </form>

    <br>
    <a href="{{ url_for('admin_orders.list_orders') }}" style="color:#04a2ff;">← Back to all orders</a>
</div>
{% endblock %}
